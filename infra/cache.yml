services:
  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped
    ports: ["6379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

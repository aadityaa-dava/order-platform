global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: order-platform
    metrics_path: /actuator/prometheus
    static_configs:
      # the services run on the host; host.docker.internal reaches the host from inside a container
      - targets:
          - host.docker.internal:8081
          - host.docker.internal:8082
          - host.docker.internal:8083
          - host.docker.internal:8084

server:
  port: 8083

spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5443/payments}
    username: ${PAYMENT_DB_USER:payments}
    password: ${PAYMENT_DB_PASSWORD:payments}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      concurrency: 3
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        linger.ms: 5
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
        max.block.ms: 5000

# Simulated payment gateway. Rates are probabilities in [0,1]; adjustable at runtime (see admin endpoint).
payment:
  gateway:
    min-latency-ms: 50
    max-latency-ms: 200
    decline-rate: 0.0     # definitive business decline, never retried
    error-rate: 0.0       # transient 5xx-style failure, retried
    timeout-rate: 0.0     # gateway hangs past the client timeout (outcome unknown), retried
    client-timeout-ms: 2000
    max-attempts: 3
    backoff-ms: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
